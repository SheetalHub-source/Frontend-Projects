<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify clone</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <ul>
            <li class="logo">
                <img src="Images/images.jpg" alt="Spotify Logo">
                <span>Spotify</span>
            </li>
            <li>Home</li>
            <li>About</li>
        </ul>
    </nav>
    <div class="mainContainer">
        <div class="songlist">
            <h1>Best of NCS - No copyright sounds</h1>
            <div class="songItemContainer">
                <div class="songItem">
                    <img  class="coverImage" src="Images/1.jpg" alt="1">
                    <span class="songName">Choli ke peeche</span>
                    <span class="songListPlay">
                        <img id="1_gif" class="gif" src="Images/playing.gif" alt="playing">
                       <span class="songDuration">0:00</span>
                        <img src="Images/play-solid.png" alt="play" class="playListPlay">
                    </span>
                </div>
                 <div class="songItem">
                    <img  class="coverImage" src="Images/2.jpg" alt="1">
                    <span class="songName">Pasoori</span>
                    <span class="songListPlay">
                        <img id="2_gif" class="gif" src="Images/playing.gif" alt="playing">
                       <span class="songDuration">0:00</span>
                        <img src="Images/play-solid.png" alt="play" class="playListPlay">
                    </span>
                </div>
                 <div class="songItem">
                    <img  class="coverImage" src="Images/3.jpg" alt="1">
                    <span class="songName">Jhalak Dikhla ja</span>
                    <span class="songListPlay">
                        <img id="3_gif" class="gif" src="Images/playing.gif" alt="playing">
                       <span class="songDuration">0:00</span>
                        <img src="Images/play-solid.png" alt="play" class="playListPlay">
                    </span>
                </div>
                 <div class="songItem">
                    <img  class="coverImage" src="Images/4.jpg" alt="1">
                    <span class="songName">Just chill</span>
                    <span class="songListPlay">
                        <img id="4_gif" class="gif" src="Images/playing.gif" alt="playing">
                       <span class="songDuration">0:00</span>
                        <img src="Images/play-solid.png" alt="play" class="playListPlay">
                    </span>
                </div>
                 <div class="songItem">
                    <img  class="coverImage" src="Images/5.jpg" alt="1">
                    <span class="songName">Dhurandar-Title Track</span>
                    <span class="songListPlay">
                        <img id="5_gif" class="gif" src="Images/playing.gif" alt="playing">
                       <span class="songDuration">0:00</span>
                        <img src="Images/play-solid.png" alt="play" class="playListPlay">
                    </span>
                </div>
                 <div class="songItem">
                    <img  class="coverImage" src="Images/6.jpg" alt="1">
                    <span class="songName">Main teri ho gyi</span>
                    <span class="songListPlay">
                        <img id="6_gif" class="gif" src="Images/playing.gif" alt="playing">
                       <span class="songDuration">0:00</span>
                        <img src="Images/play-solid.png" alt="play" class="playListPlay">
                    </span>
                </div>
                 <div class="songItem">
                    <img  class="coverImage" src="Images/7.jpg" alt="1">
                    <span class="songName">O mere khuda</span>
                    <span class="songListPlay">
                        <img id="7_gif" class="gif" src="Images/playing.gif" alt="playing">
                       <span class="songDuration">0:00</span>
                        <img src="Images/play-solid.png" alt="play" class="playListPlay">
                    </span>
                </div>
            </div>
        </div>
        <div class="songBanner"></div>
    </div>
    <div class="bottom">
        <input type="range" class="progressBar" value="0" min="0" max="100">
        <div class="icons">
            <img src="Images/backward-step-solid.png" alt="backward" id="backwardPlayButtom">
            <img src="Images/play-solid.png" alt="play" id="masterPlay">
            <img src="Images/forward-step-solid.png" alt="forward" id="forwardPlayButton">
        </div>
        <div class="songInfo">
            <img id="main_gif" class="gif" src="Images/playing.gif" alt="playing">
            <span class="currentSongName">Choli ke peeche</span>
        </div>
    </div>
</body>
<script src="script.js"></script>

</html>
